<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Winner | Gajanan Utsav Samiti</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .page {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 38px;
            color: #222;
        }

        .header p {
            margin-top: 10px;
            color: #666;
            font-size: 17px;
        }

        .form-card {
            background: #fff;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .section-title {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0b52f;
        }

        .section-title h2 {
            margin: 0;
            font-size: 23px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.12);
        }

        .winner-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .winner-card {
            border: 1px solid #ead9a0;
            border-radius: 16px;
            padding: 22px;
            background: #fffdf5;
        }

        .winner-card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .winner-card input {
            margin-bottom: 15px;
        }

        .photo-label {
            margin-top: 5px;
        }

        .submit-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            border: none;
            border-radius: 30px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(
                135deg,
                #d4af37,
                #f3d56b
            );
            color: #111;
        }

        .btn-secondary {
            background: #eee;
            color: #222;
        }

        @media(max-width: 800px) {

            .winner-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

        @media(max-width: 500px) {

            .page {
                margin: 20px auto;
                padding: 12px;
            }

            .form-card {
                padding: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .submit-area {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

<div class="page">

    <!-- ==============================
         PAGE HEADER
    =============================== -->

    <div class="header">

        <h1>🏆 Add New Winner</h1>

        <p>
            Add competition details and winner photos
        </p>

    </div>


    <!-- ==============================
         MAIN FORM
    =============================== -->

    <div class="form-card">

        <form
            method="POST"
            action="{{ url_for('admin_add_winner') }}"
            enctype="multipart/form-data"
        >

            <!-- CSRF -->

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <!-- ==============================
                 COMPETITION DETAILS
            =============================== -->

            <div class="section-title">

                <h2>🎯 Competition Details</h2>

            </div>


            <div class="form-grid">

                <div class="form-group">

                    <label>
                        Year
                    </label>

                    <input
                        type="text"
                        name="year"
                        placeholder="Example: 2025"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Game Name
                    </label>

                    <input
                        type="text"
                        name="game"
                        placeholder="Example: Dance Competition"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Slug
                    </label>

                    <input
                        type="text"
                        name="slug"
                        placeholder="Example: dance-competition"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Icon
                    </label>

                    <input
                        type="text"
                        name="icon"
                        placeholder="Example: 💃"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        Date
                    </label>

                    <input
                        type="text"
                        name="date"
                        placeholder="Example: 15 September 2025"
                    >

                </div>

            </div>


            <!-- ==============================
                 WINNERS
            =============================== -->

            <div class="section-title">

                <h2>🏅 Winner Details</h2>

            </div>


            <div class="winner-grid">


                <!-- ==========================
                     GOLD
                =========================== -->

                <div class="winner-card">

                    <h3>
                        🥇 Gold Winner
                    </h3>


                    <label>
                        Winner Name
                    </label>

                    <input
                        type="text"
                        name="first"
                        placeholder="Enter winner name"
                    >


                    <label class="photo-label">
                        Winner Photo
                    </label>

                    <input
                        type="file"
                        name="first_photo"
                        accept="image/*"
                    >

                </div>


                <!-- ==========================
                     SILVER
                =========================== -->

                <div class="winner-card">

                    <h3>
                        🥈 Silver Winner
                    </h3>


                    <label>
                        Winner Name
                    </label>

                    <input
                        type="text"
                        name="second"
                        placeholder="Enter winner name"
                    >


                    <label class="photo-label">
                        Winner Photo
                    </label>

                    <input
                        type="file"
                        name="second_photo"
                        accept="image/*"
                    >

                </div>


                <!-- ==========================
                     BRONZE
                =========================== -->

                <div class="winner-card">

                    <h3>
                        🥉 Bronze Winner
                    </h3>


                    <label>
                        Winner Name
                    </label>

                    <input
                        type="text"
                        name="third"
                        placeholder="Enter winner name"
                    >


                    <label class="photo-label">
                        Winner Photo
                    </label>

                    <input
                        type="file"
                        name="third_photo"
                        accept="image/*"
                    >

                </div>


            </div>


            <!-- ==============================
                 BUTTONS
            =============================== -->

            <div class="submit-area">

                <a
                    href="{{ url_for('admin_winners') }}"
                    class="btn btn-secondary"
                >
                    ← Cancel
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    🏆 Add Winner
                </button>

            </div>


        </form>

    </div>

</div>

</body>

</html>
