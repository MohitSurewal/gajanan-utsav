{% extends "base.html" %}

{% block title %}

Notice Manager

{% endblock %}

{% block content %}

<section class="admin-dashboard">

    <div class="container">

        <h1>📢 Notice Manager</h1>

        <form method="POST">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label>

                Notice Title

            </label>

            <input
                type="text"
                name="title"
                value="{{ notice.title }}"
                required
            >

            <label>

                Notice Message

            </label>

            <textarea
                name="message"
                rows="8"
                required
            >{{ notice.message }}</textarea>

            <button
                class="admin-btn"
                type="submit"
            >

                💾 Save Notice

            </button>

        </form>

    </div>

</section>

{% endblock %}
