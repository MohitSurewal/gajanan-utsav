{% extends "base.html" %}

{% block title %}

Committee Manager

{% endblock %}

{% block content %}

<section class="admin-dashboard">

<div class="container">

<h1>👥 Committee Manager</h1>

<form method="POST">

<input
type="hidden"
name="csrf_token"
value="{{ csrf_token() }}"
>

{% for member in committee %}

<div class="admin-card">

<label>Name</label>

<input
type="text"
name="name{{ loop.index }}"
value="{{ member.name }}"
>

<label>Post</label>

<input
type="text"
name="post{{ loop.index }}"
value="{{ member.post }}"
>

<label>Image</label>

<input
type="text"
name="image{{ loop.index }}"
value="{{ member.image }}"
>

</div>

{% endfor %}

<button
class="admin-btn"
type="submit"
>

💾 Save Committee

</button>

</form>

</div>

</section>

{% endblock %}
