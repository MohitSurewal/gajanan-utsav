{% extends "base.html" %}


{% block title %}
Edit Game | Schedule Manager
{% endblock %}


{% block content %}

<section class="admin-dashboard">

    <div class="container">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="admin-page-header">

            <div>

                <h1>
                    ✏️ Edit Game
                </h1>

                <p>
                    Update game details and rules.
                </p>

            </div>


            <a
                href="{{ url_for(
                    'admin_schedule',
                    year=current_year
                ) }}"
                class="admin-btn secondary"
            >

                ← Back to Schedule

            </a>

        </div>


        <!-- =====================================================
             FORM
        ====================================================== -->

        <div class="admin-card committee-form-card">

            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- YEAR -->

                <div class="form-group">

                    <label for="year">
                        Schedule Year
                    </label>

                    <input
                        type="text"
                        id="year"
                        name="year"
                        value="{{ current_year }}"
                        required
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="date">
                        Game Date
                    </label>

                    <input
                        type="text"
                        id="date"
                        name="date"
                        value="{{ game.date }}"
                        required
                    >

                </div>


                <!-- GAME -->

                <div class="form-group">

                    <label for="game">
                        Game Name
                    </label>

                    <input
                        type="text"
                        id="game"
                        name="game"
                        value="{{ game.game }}"
                        required
                    >

                </div>


                <!-- RULES -->

                <div class="form-group">

                    <label for="rules">
                        Game Rules
                    </label>

                    <textarea
                        id="rules"
                        name="rules"
                        rows="8"
                        placeholder="One rule per line"
                    >{% for rule in game.get('rules', []) %}{{ rule }}
{% endfor %}</textarea>

                    <small>
                        Write one rule per line.
                    </small>

                </div>


                <!-- WINNER LINK -->

                <div class="form-group">

                    <label for="winner_link">
                        Winner Link
                        <small>(Optional)</small>
                    </label>

                    <input
                        type="text"
                        id="winner_link"
                        name="winner_link"
                        value="{{ game.get('winner_link', '') }}"
                    >

                </div>


                <!-- ACTIONS -->

                <div class="committee-form-actions">

                    <a
                        href="{{ url_for(
                            'admin_schedule',
                            year=current_year
                        ) }}"
                        class="admin-btn secondary"
                    >

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="admin-btn"
                    >

                        💾 Update Game

                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
