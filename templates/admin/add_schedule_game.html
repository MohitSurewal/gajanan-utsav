{% extends "base.html" %}


{% block title %}
Add Game | Schedule Manager
{% endblock %}


{% block content %}

<section class="admin-dashboard">

    <div class="container">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="admin-page-header">

            <div>

                <h1>
                    ➕ Add Game
                </h1>

                <p>
                    Add a new game with its rules and winner link.
                </p>

            </div>


            <a
                href="{{ url_for(
                    'admin_schedule',
                    year=current_year
                ) }}"
                class="admin-btn secondary"
            >
                ← Back to Schedule
            </a>

        </div>


        <!-- =====================================================
             FORM
        ====================================================== -->

        <div class="admin-card committee-form-card">

            <form method="POST">

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- YEAR -->

                <div class="form-group">

                    <label for="year">
                        Schedule Year
                    </label>

                    <input
                        type="text"
                        id="year"
                        name="year"
                        value="{{ current_year }}"
                        required
                    >

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="date">
                        Game Date
                    </label>

                    <input
                        type="text"
                        id="date"
                        name="date"
                        placeholder="Example: 16 September 2026"
                        required
                    >

                </div>


                <!-- GAME -->

                <div class="form-group">

                    <label for="game">
                        Game Name
                    </label>

                    <input
                        type="text"
                        id="game"
                        name="game"
                        placeholder="Example: Lemon Spoon Race"
                        required
                    >

                </div>


                <!-- RULES -->

                <div class="form-group">

                    <label for="rules">
                        Game Rules
                    </label>

                    <textarea
                        id="rules"
                        name="rules"
                        rows="7"
                        placeholder="Write one rule per line

Example:
Each participant must carry the spoon carefully.
No running is allowed.
The first participant to finish wins."
                    ></textarea>

                    <small>
                        Write each rule on a separate line.
                    </small>

                </div>


                <!-- WINNER LINK -->

                <div class="form-group">

                    <label for="winner_link">
                        Winner Link
                        <small>(Optional)</small>
                    </label>

                    <input
                        type="text"
                        id="winner_link"
                        name="winner_link"
                        placeholder="Example: lemon-spoon-race"
                    >

                    <small>
                        Use this only when the game has a
                        Winners section.
                    </small>

                </div>


                <!-- ACTIONS -->

                <div class="committee-form-actions">

                    <a
                        href="{{ url_for(
                            'admin_schedule',
                            year=current_year
                        ) }}"
                        class="admin-btn secondary"
                    >
                        Cancel
                    </a>


                    <button
                        type="submit"
                        class="admin-btn"
                    >
                        💾 Add Game
                    </button>

                </div>

            </form>

        </div>

    </div>

</section>

{% endblock %}
